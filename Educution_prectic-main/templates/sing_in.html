<!DOCTYPE html>
<html>
<head>
    <title>Вход - Совушка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Совушка</div>
            <div class="nav-links">
                <a href="{{ url_for('main') }}">Главная</a>
                <a href="{{ url_for('registration') }}">Регистрация</a>
                <a href="{{ url_for('sing_in') }}">Войти</a>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-form">
            <h2>Вход</h2>
            <form method="POST">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" name="login" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                Нет аккаунта? <a href="{{ url_for('registration') }}">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</body>
</html>
