<!DOCTYPE html>
<html>
<head>
    <title>Группы - Совушка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Совушка</div>
            <div class="nav-links">
                <a href="{{ url_for('main') }}">Главная</a>
                <a href="{{ url_for('groups') }}">Группы</a>
                <a href="{{ url_for('teachers') }}">Педагоги</a>
                <a href="{{ url_for('news') }}">Новости</a>
            </div>
        </nav>
    </header>

    <div class="hero">
        <h1>Наши группы</h1>
    </div>

    <div class="cards-container">
        {% for group in groups %}
        <div class="card">
            <h3>{{ group.name }}</h3>
            <p>Дети в группе: {{ group.kids|length }}</p>
            <ul>
                {% for kid in group.kids %}
                <li>{{ kid.name }} ({{ kid.age }} лет)</li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}
    </div>
</body>
</html>
