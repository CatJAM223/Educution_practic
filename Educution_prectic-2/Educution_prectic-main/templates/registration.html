<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Совушка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login-in.css') }}">
</head>
<body>
    <main>
        <div class="container">
            <div class="logo">
                <img src="{{ url_for('static', filename='img/logo.webp') }}">
            </div>
            <form class="window-login-in" method="POST">
                <div>
                    <h1 class="title-login-in">Регистрация</h1>
                </div>
                <div class="box-input">
                    <div class="input">
                        <input type="text" name="login" placeholder="Логин" required>
                        <input type="password" name="password" placeholder="Пароль" required>
                        <input type="password" name="confirm_password" placeholder="Повторите пароль" required>
                    </div>
                    <button type="submit">Зарегистрироваться</button>
                </div>
                <p style="text-align: center; margin-top: 1rem;">
                    Уже есть аккаунт? <a href="{{ url_for('sing_in') }}" style="color: #4668AA;">Войти</a>
                </p>
            </form>
        </div>
    </main>
</body>
</html>
