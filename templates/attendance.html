<!DOCTYPE html>
<html>
<head>
    <title>Посещаемость - Совушка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Совушка</div>
            <div class="nav-links">
                <a href="{{ url_for('main') }}">Главная</a>
                <a href="{{ url_for('groups') }}">Группы</a>
                <a href="{{ url_for('attendance') }}">Посещаемость</a>
                <a href="{{ url_for('news') }}">Новости</a>
            </div>
        </nav>
    </header>

    <div class="hero">
        <h1>Посещаемость детей</h1>
    </div>

    <div class="cards-container">
        <div class="card">
            <h3>Статистика посещаемости</h3>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th style="border: 1px solid #ddd; padding: 8px;">Ребенок</th>
                        <th style="border: 1px solid #ddd; padding: 8px;">Дата</th>
                        <th style="border: 1px solid #ddd; padding: 8px;">Посещение</th>
                    </tr>
                </thead>
                <tbody>
                    {% for att in attendance_list %}
                    <tr>
                        <td style="border: 1px solid #ddd; padding: 8px;">{{ att.kid }}</td>
                        <td style="border: 1px solid #ddd; padding: 8px;">{{ att.data }}</td>
                        <td style="border: 1px solid #ddd; padding: 8px;">
                            {% if att.attendance %}
                                ✅ Присутствовал
                            {% else %}
                                ❌ Отсутствовал
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
